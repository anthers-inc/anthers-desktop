# The installer + updater release workflow. Its life is separate from `ci.yml` by
# design: CI is the deploy gate (since 2026-08-09 in the platform repo) and a code
# check must never queue behind packaging failures or a macOS runner queue. Cutting
# a release happens here, on an explicit `v<calver>` tag — the same shape as the
# platform repository's tags, numbered on the shell's own line; a workflow_dispatch
# run builds every platform and attaches its bundles as workflow artifacts without
# touching any release — the way the matrix gets proven before its first tag.
#
# Unsigned by intent at this stage: Windows shows a SmartScreen warning and
# installs; the macOS artifacts are CI proof, not yet distributable (Gatekeeper),
# and both become a matter of adding credentials, never wiring (see the README).
name: release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,rpm,appimage
          - os: windows-latest
            bundles: nsis,msi
          - os: macos-latest
            bundles: app,dmg
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # Full history and tags: the changelist is a diff against the previous calver
      # tag, and a shallow clone has neither the tag nor the commits behind it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@stable

      - name: Install the webview's Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # A clean checkout has no web-dist; the shell resolves the platform pin, which
      # is itself the release's live exposure to the web-build signature gate.
      - name: Resolve the pinned web build
        run: bun run web

      # The release's name and its changelist both read the version the four fields
      # carry rather than the tag's own text, so a tag and a version that disagree
      # cannot name the release one number and the bundles another. 🚨 `shell: bash`
      # is load-bearing: the Windows runner's default is PowerShell, where
      # `$GITHUB_OUTPUT` is not a variable and the step fails before the build starts.
      - name: Read the version
        id: version
        shell: bash
        run: |
          version="$(grep -m1 '"version"' package.json | sed -E 's/.*"version": *"([^"]+)".*/\1/')"
          echo "version=${version}" >>"$GITHUB_OUTPUT"

      - uses: tauri-apps/tauri-action@v0
        env:
          # The updater's minisign private half. With it, the bundler emits the
          # signed updater artifacts and tauri-action generates latest.json from
          # them; without it the release would ship installers but strand the
          # update channel, which is why the key rides this workflow from its
          # first release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # The action's own release creation and artifact upload.
          GITHUB_TOKEN: ${{ github.token }}
        with:
          # A release only happens for a real tag push. A dispatch run
          # (`github.ref_name` would otherwise read `main` — and the first proof run
          # created a draft release *named main* from it) leaves tagName empty, which
          # makes tauri-action upload the bundles as workflow artifacts instead.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "Anthers Desktop ${{ steps.version.outputs.version }}"
          # The body is not the action's business: `scripts/release-notes.sh` writes the
          # mechanical changelist below, once the release it edits exists.
          releaseBody: ""
          releaseDraft: true
          prerelease: false
          args: --bundles ${{ matrix.bundles }}

      # One writer, not three: the matrix races on a single release, and three
      # identical edits would still be three concurrent writers. Linux runs first in
      # practice and its leg owns the body.
      - name: Write the release notes
        if: startsWith(github.ref, 'refs/tags/') && matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/release-notes.sh

      # A dispatch run leaves nothing on the release channel (the tagName guard
      # above), and tauri-action uploads artifacts only in release context — so
      # the proof's bundles land here instead, as a human-downloadable build.
      # Tag runs attach everything to the draft release and skip this.
      - name: Attach the bundles as run artifacts (dispatch runs only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: bundles-${{ matrix.os }}
          path: src-tauri/target/release/bundle
          if-no-files-found: error